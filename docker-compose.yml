name: portfolio
services:
  web:
    container_name: web
    build:
      context: ./apps/web
      dockerfile: ./Dockerfile
    restart: always
    ports:
      - "127.0.0.1:4200:4200"
    networks:
      - public_net

  api:
    container_name: api
    build:
      context: ./apps/api
      dockerfile: ./Dockerfile
    restart: always
    ports:
      - "127.0.0.1:3333:3333"
    networks:
      - public_net
    command: "npm start"

networks:
  public_net:
    driver: bridge