name: portfolio
services:
  web:
    container_name: web
    build:
      context: ./apps/web
      dockerfile: ./Dockerfile
    restart: always
    environment:
      PORT: 4200
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3333}
    ports:
      - "127.0.0.1:4200:4200"
    networks:
      - public_net

  api:
    container_name: api
    build:
      context: ./
      dockerfile: ./apps/api/Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:3333:3333"
    networks:
      - public_net
    command: "npm start"

networks:
  public_net:
    driver: bridge
