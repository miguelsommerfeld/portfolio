@if (isOpen()) {
  <div
    animate.enter="auth-backdrop-enter"
    animate.leave="auth-backdrop-leave"
    data-lenis-prevent
    data-testid="resume-card-backdrop"
    (click)="onBackdropClick($event)"
    (wheel)="onPreventBackgroundScroll($event)"
    (touchmove)="onPreventBackgroundScroll($event)"
    class="fixed inset-0 z-60 flex items-center justify-center overscroll-contain bg-neutral-950/60 p-4 backdrop-blur-sm sm:p-6"
  >
    <div
      animate.enter="auth-card-enter"
      animate.leave="auth-card-leave"
      role="dialog"
      aria-modal="true"
      aria-labelledby="resume-card-title"
      data-testid="resume-card"
      class="relative w-full max-w-sm overflow-hidden rounded-3xl border border-white/15 bg-neutral-950/55 bg-linear-to-b from-white/10 to-white/3 p-6 backdrop-blur-2xl backdrop-saturate-150 shadow-[inset_0_1px_0_0_rgba(255,255,255,0.16),0_24px_64px_-12px_rgba(0,0,0,0.75)] sm:p-7"
    >
      <div class="flex items-start justify-between gap-4">
        <div class="space-y-1">
          <h2 id="resume-card-title" class="text-lg font-semibold tracking-tight text-white/95">
            Acessar currículo
          </h2>
          <p class="text-xs leading-relaxed text-white/60">
            @if (mode() === 'options') {
              Escolha qual versão deseja visualizar
            } @else {
              Informe o código diário de 8 caracteres
            }
          </p>
        </div>

        <button
          #closeButtonRef
          type="button"
          aria-label="Fechar opções de currículo"
          (click)="onClose()"
          class="inline-flex shrink-0 cursor-pointer items-center justify-center rounded-full p-1.5 text-white/60 transition-colors duration-200 hover:bg-white/10 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/40 motion-reduce:transition-none"
        >
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true" class="h-4 w-4">
            <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      @if (mode() === 'options') {
        <div class="mt-6 flex flex-col gap-3">
          <button
            type="button"
            [disabled]="isLoading()"
            (click)="onSelectSensitive()"
            class="group flex w-full cursor-pointer items-center justify-center rounded-2xl border border-white/15 bg-white/6 px-4 py-3 text-sm font-medium text-white/90 shadow-[inset_0_1px_0_0_rgba(255,255,255,0.10)] origin-center transition-all duration-200 ease-[cubic-bezier(0.22,1,0.36,1)] will-change-transform hover:scale-[1.02] hover:border-white/25 hover:bg-white/[0.12] hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/40 disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:scale-100 motion-reduce:transition-none motion-reduce:hover:scale-100"
          >
            Currículo com dados sensíveis
          </button>

          <button
            type="button"
            [disabled]="isLoading()"
            (click)="onSelectCensored()"
            class="group flex w-full cursor-pointer items-center justify-center rounded-2xl border border-white/15 bg-white/6 px-4 py-3 text-sm font-medium text-white/90 shadow-[inset_0_1px_0_0_rgba(255,255,255,0.10)] origin-center transition-all duration-200 ease-[cubic-bezier(0.22,1,0.36,1)] will-change-transform hover:scale-[1.02] hover:border-white/25 hover:bg-white/[0.12] hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/40 disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:scale-100 motion-reduce:transition-none motion-reduce:hover:scale-100"
          >
            Currículo sem dados sensíveis
          </button>
        </div>
      } @else {
        <form animate.enter="fade-up-enter" (submit)="onSubmitCode($event)" class="mt-6 flex flex-col gap-4">
          <div class="space-y-2">
            <label for="resume-access-code" class="block text-xs font-medium text-white/75">
              Código de acesso (8 caracteres)
            </label>
            <input
              #codeInputRef
              id="resume-access-code"
              type="text"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              maxlength="9"
              placeholder="XXXX-XXXX"
              [value]="accessCode()"
              [disabled]="isLoading()"
              (input)="onCodeInput($event)"
              class="w-full rounded-2xl border border-white/15 bg-white/6 px-4 py-3 text-center text-sm font-medium tracking-[0.22em] text-white uppercase placeholder:text-white/30 focus-visible:outline-none focus-visible:border-white/35 focus-visible:ring-2 focus-visible:ring-white/40 disabled:cursor-not-allowed disabled:opacity-50"
            />
          </div>

          <div class="flex items-center gap-2.5">
            <button
              type="button"
              (click)="onBackToOptions()"
              class="inline-flex cursor-pointer items-center justify-center rounded-2xl border border-white/12 bg-white/4 px-4 py-3 text-xs font-medium text-white/75 transition-colors duration-200 hover:bg-white/10 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/40 motion-reduce:transition-none"
            >
              Voltar
            </button>

            <button
              type="submit"
              [disabled]="!isCodeComplete() || isLoading()"
              class="flex-1 cursor-pointer rounded-2xl border border-white/20 bg-white/12 px-4 py-3 text-sm font-medium text-white/95 shadow-[inset_0_1px_0_0_rgba(255,255,255,0.16)] origin-center transition-all duration-200 ease-[cubic-bezier(0.22,1,0.36,1)] will-change-transform hover:scale-[1.02] hover:border-white/30 hover:bg-white/18 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/40 disabled:cursor-not-allowed disabled:opacity-45 disabled:hover:scale-100 motion-reduce:transition-none motion-reduce:hover:scale-100"
            >
              Abrir currículo
            </button>
          </div>
        </form>
      }

      @if (errorMessage(); as error) {
        <p
          animate.enter="toast-enter"
          animate.leave="toast-leave"
          role="alert"
          class="mt-4 rounded-xl border border-red-400/25 bg-red-500/10 px-3.5 py-2.5 text-xs leading-relaxed text-red-200"
        >
          {{ error }}
        </p>
      }
    </div>
  </div>
}
