@if (message(); as error) {
  <div
    class="pointer-events-none fixed inset-x-4 bottom-5 z-70 mx-auto flex max-w-sm justify-center sm:inset-x-auto sm:right-6 sm:bottom-6 sm:mx-0"
  >
    <div
      animate.enter="toast-enter"
      animate.leave="toast-leave"
      role="alert"
      aria-live="assertive"
      data-testid="error-toast"
      class="pointer-events-auto flex w-full items-start gap-3 rounded-2xl border border-red-400/25 bg-neutral-950/75 bg-linear-to-b from-red-500/12 to-white/3 px-4 py-3.5 backdrop-blur-2xl backdrop-saturate-150 shadow-[inset_0_1px_0_0_rgba(255,255,255,0.12),0_18px_48px_-12px_rgba(0,0,0,0.8)]"
    >
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true" class="mt-0.5 h-4 w-4 shrink-0 text-red-300">
        <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5" />
        <path d="M10 6.25v4.5M10 13.5h.01" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
      </svg>

      <p class="flex-1 text-xs leading-relaxed text-red-100/95">
        {{ error }}
      </p>

      <button
        type="button"
        aria-label="Fechar aviso de erro"
        (click)="onDismiss()"
        class="inline-flex shrink-0 cursor-pointer items-center justify-center rounded-full p-1 text-white/55 transition-colors duration-200 hover:bg-white/10 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/40 motion-reduce:transition-none"
      >
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true" class="h-3.5 w-3.5">
          <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </div>
}
