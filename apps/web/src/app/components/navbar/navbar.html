<header
  class="fixed top-0 inset-x-0 z-50 h-14 w-full border-b border-white/10 bg-neutral-950/35 bg-linear-to-b from-white/8 to-white/2 backdrop-blur-xl backdrop-saturate-150 shadow-[inset_0_1px_0_0_rgba(255,255,255,0.12),0_4px_24px_-4px_rgba(0,0,0,0.28)]"
>
  <nav aria-label="Navegação principal" class="flex h-full w-full items-center justify-between gap-4 px-5 sm:px-8 lg:px-12">
    <span class="min-w-0 truncate text-sm sm:text-base font-semibold tracking-tight text-white/95 select-none">
      Miguel L. Sommerfeld
    </span>

    <div class="flex shrink-0 items-center gap-4 sm:gap-6">
      <a
        [href]="linkedinProfileUrl"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Perfil no LinkedIn"
        class="group inline-flex items-center justify-center rounded-full p-1 origin-center transition-all duration-200 ease-[cubic-bezier(0.22,1,0.36,1)] will-change-transform hover:scale-110 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/40 motion-reduce:transition-none motion-reduce:hover:scale-100"
      >
        <img
          src="/icons/linkedin.png"
          alt=""
          aria-hidden="true"
          class="h-7 w-7 brightness-0 invert opacity-75 transition-opacity duration-200 group-hover:opacity-100"
        />
      </a>

      <a
        [href]="githubProfileUrl"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Perfil no GitHub"
        class="group inline-flex items-center justify-center rounded-full p-1.5 origin-center transition-all duration-200 ease-[cubic-bezier(0.22,1,0.36,1)] will-change-transform hover:scale-110 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/40 motion-reduce:transition-none motion-reduce:hover:scale-100"
      >
        <img
          src="/icons/github.png"
          alt=""
          aria-hidden="true"
          class="h-6 w-6 invert opacity-75 transition-opacity duration-200 group-hover:opacity-100"
        />
      </a>

      @if (isAuthenticated()) {
        <button
          type="button"
          [disabled]="isLoggingOut()"
          (click)="onLogout()"
          class="inline-flex items-center justify-center rounded-full border border-white/15 bg-white/6 px-3.5 py-1.5 text-sm font-medium text-white/90 origin-center transition-all duration-200 ease-[cubic-bezier(0.22,1,0.36,1)] will-change-transform hover:scale-105 hover:bg-white/[0.14] hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/40 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 motion-reduce:transition-none motion-reduce:hover:scale-100"
        >
          Logout
        </button>
      } @else {
        <a
          routerLink="/login"
          class="inline-flex items-center justify-center rounded-full border border-white/15 bg-white/6 px-3.5 py-1.5 text-sm font-medium text-white/90 origin-center transition-all duration-200 ease-[cubic-bezier(0.22,1,0.36,1)] will-change-transform hover:scale-105 hover:bg-white/[0.14] hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/40 motion-reduce:transition-none motion-reduce:hover:scale-100"
        >
          Auth
        </a>
      }
    </div>
  </nav>
</header>
